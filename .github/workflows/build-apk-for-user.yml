name: Build APK for User

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支'
        required: true
        default: 'fix/scroll-window-coverage'
      product:
        description: '产品变体：appCore 无本地引擎，appFull 内置本地 OCR/擦除/气泡检测'
        required: true
        type: choice
        options:
          - appCore
          - appFull
        default: appFull
      abi:
        description: '目标 ABI：只上传该 ABI 的 APK；universal 关闭 ABI 拆分出单包'
        required: true
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - universal
        default: arm64-v8a

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PRODUCT: ${{ github.event.inputs.product }}
      PRODUCT_TAG: "${{ github.event.inputs.product == 'appFull' && 'full' || 'core' }}"
      TARGET_ABI: ${{ github.event.inputs.abi }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clear 18PlusList.txt
        run: |
          echo "清空18PlusList.txt"
          echo "" > $GITHUB_WORKSPACE/app/src/main/assets/18PlusList.txt

      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          # appCore -> AppCore：Gradle 变体任务名是驼峰形式
          PRODUCT_CAP=$(echo "$PRODUCT" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
          if [ "$TARGET_ABI" = "universal" ]; then
            ./gradlew assemble${PRODUCT_CAP}Debug -PenableAbiSplits=false --no-daemon --no-configuration-cache
          else
            # 保留 ABI 拆分，按目标 ABI 取包；debug 的 applicationIdSuffix=".debug"，
            # 可以和 release 版本同时安装。
            ./gradlew assemble${PRODUCT_CAP}Debug -PenableAbiSplits=true --no-daemon --no-configuration-cache
          fi
        env:
          COMMIT_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: debug-${{ github.run_number }}

      - name: Collect target APK
        run: |
          APK_DIR="$GITHUB_WORKSPACE/app/build/outputs/apk/${PRODUCT}/debug"
          echo "构建输出目录: $APK_DIR"
          ls -la "$APK_DIR" || true
          if [ "$TARGET_ABI" = "universal" ]; then
            SRC=$(find "$APK_DIR" -maxdepth 1 -name "*.apk" | grep -i universal | head -n 1)
          else
            SRC=$(find "$APK_DIR" -maxdepth 1 -name "*.apk" | grep -i "$TARGET_ABI" | grep -vi universal | head -n 1)
          fi
          if [ -z "$SRC" ]; then
            echo "找不到 $TARGET_ABI 的 APK"
            exit 1
          fi
          OUT_DIR="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT_DIR"
          NAME="legado-debug-${GITHUB_RUN_NUMBER}-${PRODUCT_TAG}-${TARGET_ABI}.apk"
          cp "$SRC" "$OUT_DIR/$NAME"
          echo "产物: $OUT_DIR/$NAME"
          ls -la "$OUT_DIR"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-debug-${{ github.event.inputs.product == 'appFull' && 'full' || 'core' }}-${{ github.event.inputs.abi }}-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
